name: .NET checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore GiftOfTheGivers.sln
      - run: dotnet build GiftOfTheGivers.sln --configuration Release --no-restore
      - run: dotnet test GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj --configuration Release --no-build --no-restore
        env:
          UI_SNAPSHOT_DIRECTORY: ${{ github.workspace }}/ui-snapshots
      - name: A.1 assignment unit tests
        run: dotnet test GiftOfTheGivers.AssignmentTests/GiftOfTheGivers.AssignmentTests.csproj -c Release --no-build --no-restore --filter "Category=Unit" --logger "trx;LogFileName=assignment-unit.trx" --results-directory TestResults/Assignment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-unit-results
          path: TestResults/Assignment/assignment-unit.trx
      - name: Check desktop and mobile layouts
        run: |
          npm install --prefix /tmp/gotg-ui-tools --no-package-lock playwright@1.56.1
          /tmp/gotg-ui-tools/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/gotg-ui-tools/node_modules/playwright node scripts/check-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-pages
          path: ui-snapshots

  assignment-system-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SqlTestOnly!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlTestOnly!2026' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    env:
      GOTG_TEST_SQL: Server=localhost,1433;Database=master;User Id=sa;Password=SqlTestOnly!2026;Encrypt=True;TrustServerCertificate=True
      GOTG_REPO_ROOT: ${{ github.workspace }}
      GOTG_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/Assignment
      GOTG_WEB_PUBLISH_DIR: /tmp/gotg-published/web
      GOTG_FUNCTIONS_PUBLISH_DIR: /tmp/gotg-published/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install local Functions, storage emulator and evidence browser
        run: |
          npm install --prefix "$RUNNER_TEMP/gotg-tools" --no-package-lock azure-functions-core-tools@4 azurite@3.35.0 playwright@1.56.1
          echo "$RUNNER_TEMP/gotg-tools/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gotg-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Publish actual web and Functions applications
        run: |
          dotnet publish GiftOfTheGivers.csproj -c Release -o "$GOTG_WEB_PUBLISH_DIR"
          dotnet publish GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj -c Release -o "$GOTG_FUNCTIONS_PUBLISH_DIR"
      - name: A.2 integration, A.3 load/stress and A.4 Selenium
        run: dotnet test GiftOfTheGivers.AssignmentTests/GiftOfTheGivers.AssignmentTests.csproj -c Release --filter "Category!=Unit" --logger "trx;LogFileName=assignment-system.trx" --results-directory TestResults/Assignment
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: assignment-unit-results
          path: TestResults/Assignment/unit
      - name: Render genuine measured evidence
        if: always()
        run: |
          python3 scripts/assignment-evidence.py TestResults/Assignment
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/gotg-tools/node_modules/playwright" node scripts/capture-assignment-evidence.cjs TestResults/Assignment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-a1-a4-evidence
          path: TestResults/Assignment

  windows-assignment-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOTG_REPO_ROOT: ${{ github.workspace }}
      GOTG_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Unit regressions and both regional-formatting cases
        run: |
          dotnet test GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj -c Release --logger "trx;LogFileName=windows-regressions.trx" --results-directory TestResults/Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test GiftOfTheGivers.AssignmentTests/GiftOfTheGivers.AssignmentTests.csproj -c Release --filter "Category=Unit" --logger "trx;LogFileName=windows-unit.trx" --results-directory TestResults/Windows
      - name: Prepare real Windows LocalDB and npm tools in a path with spaces
        run: |
          $localDb = Get-ChildItem 'C:/Program Files/Microsoft SQL Server' -Filter SqlLocalDB.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $localDb) { throw 'SQL Server LocalDB is missing from the Windows runner.' }
          & $localDb create GotgAssignment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $localDb start GotgAssignment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'GOTG_TEST_SQL=Server=(localdb)\GotgAssignment;Database=master;Trusted_Connection=True;Encrypt=False' >> $env:GITHUB_ENV
          $toolRoot = Join-Path $env:RUNNER_TEMP 'gotg tools & checks'
          npm.cmd install --prefix $toolRoot --no-package-lock azure-functions-core-tools@4 azurite@3.35.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GOTG_AZURITE_PATH=$toolRoot/node_modules/.bin/azurite.cmd" >> $env:GITHUB_ENV
          "GOTG_FUNC_PATH=$toolRoot/node_modules/.bin/func.cmd" >> $env:GITHUB_ENV
          "GOTG_WEB_PUBLISH_DIR=$env:RUNNER_TEMP/gotg published/web" >> $env:GITHUB_ENV
          "GOTG_FUNCTIONS_PUBLISH_DIR=$env:RUNNER_TEMP/gotg published/functions" >> $env:GITHUB_ENV
      - name: Publish web and Functions applications
        run: |
          dotnet publish GiftOfTheGivers.csproj -c Release -o "$env:GOTG_WEB_PUBLISH_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj -c Release -o "$env:GOTG_FUNCTIONS_PUBLISH_DIR"
      - name: Real Windows Azurite Functions SQL and Selenium scenarios
        run: dotnet test GiftOfTheGivers.AssignmentTests/GiftOfTheGivers.AssignmentTests.csproj -c Release --filter "Category!=Unit" --logger "trx;LogFileName=windows-system.trx" --results-directory TestResults/Windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: TestResults/Windows
